<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>لا يوجد اتصال — إيجاري EJARI</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
      }
      .icon {
        font-size: 64px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.8;
        margin: 0 0 24px;
      }
      button {
        background: #3b82f6;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 32px;
        font-size: 15px;
        font-family: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذّر الوصول إلى إيجاري. تحقق من اتصالك بالشبكة ثم أعد المحاولة.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
